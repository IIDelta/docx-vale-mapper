# Style guide:
# Use dd Month yyyy. Avoid numeric-only date formats.
#
# The patterns are limited to modern years and avoid embedded legal,
# regulatory, and identifier numbering such as 1121-8-1.

extends: existence
message: "Style guide date format: Use dd Month yyyy, for example, 28 March 2025. Avoid numeric-only dates."
level: error
nonword: true
tokens:
  - '(?<![A-Za-z0-9.])(?:0?[1-9]|[12]\d|3[01])[/-](?:0?[1-9]|1[0-2])[/-](?:19|20)\d{2}(?!-\d)'
  - '(?<![A-Za-z0-9.])(?:19|20)\d{2}[/-](?:0?[1-9]|1[0-2])[/-](?:0?[1-9]|[12]\d|3[01])(?!-\d)'
