# Style guide:
# Hyphenate established temporary and permanent compound modifiers.
# Do not use a hyphen after an adverb ending in -ly.

extends: substitution
message: "Style guide compound format: Use '%s' instead of '%s'."
level: error
ignorecase: true
capitalize: true
action:
  name: replace
swap:
  '\bdouble blind\b': double-blind
  '\bplacebo controlled\b': placebo-controlled
  '\bopen label\b': open-label
  '\bcase control trial\b': case-control trial
  '\bfirst line treatment\b': first-line treatment
  '\blong term outcome\b': long-term outcome
  '\brisk adjusted analysis\b': risk-adjusted analysis
  '\bself administered questionnaire\b': self-administered questionnaire
  '\bfollow up visit\b': follow-up visit
  '\bpreviously-treated population\b': previously treated population
  '\bclosely-related events\b': closely related events
