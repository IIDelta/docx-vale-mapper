# Style guide:
# Use participant rather than patient, subject, or healthy volunteer
# when referring to an enrolled clinical-trial individual.
#
# The rule is limited to high-confidence trial contexts.
# Disease-specific cancer and diabetes wording is handled by
# PersonFirstLanguage.yml.

extends: substitution
message: "Style guide terminology: Use '%s' instead of '%s' for an enrolled clinical-trial individual."
level: warning
ignorecase: true
capitalize: true
action:
  name: replace
swap:
  '(?<!cancer )(?<!diabetic )\bpatients were enrolled\b': participants were enrolled
  '(?<!cancer )(?<!diabetic )\bpatient was enrolled\b': participant was enrolled
  '(?<!cancer )(?<!diabetic )\bpatients enrolled\b': participants enrolled
  '(?<!cancer )(?<!diabetic )\bpatient enrolled\b': participant enrolled
  '(?<!cancer )(?<!diabetic )\bpatients were randomized\b': participants were randomized
  '(?<!cancer )(?<!diabetic )\bpatient was randomized\b': participant was randomized
  '\bsubjects were enrolled\b': participants were enrolled
  '\bsubject was enrolled\b': participant was enrolled
  '\bsubjects were randomized\b': participants were randomized
  '\bsubject was randomized\b': participant was randomized
  '(?<!cancer )(?<!diabetic )\bpatients received\b': participants received
  '(?<!cancer )(?<!diabetic )\bpatient received\b': participant received
  '\bsubjects received\b': participants received
  '\bsubject received\b': participant received
  '\bhealthy volunteers were enrolled\b': participants were enrolled
  '\bhealthy volunteer was enrolled\b': participant was enrolled
