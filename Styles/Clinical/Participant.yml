# Takeda Style Guide v6.0:
# Section 3.1 Participant and Trial
# Section 3.2 Sex and Identity
#
# In clinical-trial narrative text, use "participant" rather than
# "patient," "subject," or "healthy volunteer."
#
# Cancer-patient and diabetic-patient phrases are excluded because
# A3 PersonFirstLanguage.yml provides the more specific preferred
# wording: "participant(s) with cancer/diabetes."

extends: substitution
message: "Takeda terminology: Use '%s' instead of '%s' for an enrolled clinical-trial individual."
level: warning
ignorecase: true
capitalize: true
action:
  name: replace
swap:
  '(?<!cancer )(?<!diabetic )patients': participants
  '(?<!cancer )(?<!diabetic )patient(?![- ]reported outcomes?\b)': participant
  subject: participant
  subjects: participants
  healthy volunteer: participant
  healthy volunteers: participants
