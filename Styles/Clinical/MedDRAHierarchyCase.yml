# Style guide:
# Capitalize MedDRA hierarchy labels when referring to the hierarchy
# category itself. Do not capitalize the specific names under a level.

extends: substitution
message: "Style guide MedDRA capitalization: Use '%s' instead of '%s'."
level: warning
ignorecase: false
capitalize: false
action:
  name: replace
swap:
  '\bsystem organ class\s*\(SOC\)': 'System Organ Class (SOC)'
  '\bhigh level group term\s*\(HLGT\)': 'High Level Group Term (HLGT)'
  '\bhigh level term\s*\(HLT\)': 'High Level Term (HLT)'
  '\bpreferred term\s*\(PT\)': 'Preferred Term (PT)'
  '\blowest level term\s*\(LLT\)': 'Lowest Level Term (LLT)'
  '\bstandardised MedDRA query\s*\(SMQ\)': 'Standardised MedDRA Query (SMQ)'