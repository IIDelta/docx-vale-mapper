# Style guide:
# Avoid generic sex-specific pronouns when sex specificity is irrelevant.
# Review male/female noun use only where person-first wording may be needed.

extends: existence
message: "Style guide sex-and-identity review: Revise '%s' to use person-first, non-sex-specific wording where sex specificity is not relevant."
level: warning
ignorecase: true
tokens:
  - '\bhe/she\b'
  - '\bhe or she\b'
  - '\bhis/her\b'
  - '\bhim/her\b'
  - '\bs/he\b'
  - '\bthe male\b(?!\s+(?:participant|partner|patient|subject)\b)'
  - '\bthe female\b(?!\s+(?:participant|partner|patient|subject)\b)'
