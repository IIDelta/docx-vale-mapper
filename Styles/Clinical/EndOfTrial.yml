# Style guide:
# Use End of Trial (EOT), not End of Study (EOS).

extends: substitution
message: "Style guide terminology: Use '%s' instead of '%s'."
level: error
ignorecase: true
capitalize: true
nonword: true
action:
  name: replace
swap:
  '\bEnd of Study\s*\(EOS\)(?=\s|$|[.,;:])': 'End of Trial (EOT)'
  '\bEnd of Study\b(?!\s*\(EOS\))': End of Trial
  '(?<!End of Study \()EOS\b': EOT
